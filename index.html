<style>
/* Layout: cabeçalho fixo com abas; painel de resumo → detalhe; corais em grade quadrada (WYSIWYG) */
:root{
  --bg:#eef2f6; --surface:#ffffff; --ink:#0d1a2b; --muted:#56677d; --line:#d6dee8;
  --accent:#3b4cd4; --accent-ink:#ffffff; --band:rgba(59,76,212,.10);
  --ok:#1d7f55; --warn:#a86b12; --bad:#bf3b35;
  --ok-bg:rgba(29,127,85,.11); --warn-bg:rgba(168,107,18,.12); --bad-bg:rgba(191,59,53,.11);
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08101c; --surface:#0f1a2a; --ink:#e5ecf5; --muted:#8fa0b7; --line:#1f2f46;
    --accent:#8391ff; --accent-ink:#0a0f1e; --band:rgba(131,145,255,.15);
    --ok:#4cc38a; --warn:#e3aa4c; --bad:#f2766d;
    --ok-bg:rgba(76,195,138,.13); --warn-bg:rgba(227,170,76,.14); --bad-bg:rgba(242,118,109,.14);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#08101c; --surface:#0f1a2a; --ink:#e5ecf5; --muted:#8fa0b7; --line:#1f2f46;
  --accent:#8391ff; --accent-ink:#0a0f1e; --band:rgba(131,145,255,.15);
  --ok:#4cc38a; --warn:#e3aa4c; --bad:#f2766d;
  --ok-bg:rgba(76,195,138,.13); --warn-bg:rgba(227,170,76,.14); --bad-bg:rgba(242,118,109,.14);
  color-scheme: dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:26px;font-weight:700}
h2{font-size:19px;font-weight:700}
h3{font-size:15px;font-weight:600;font-family:var(--body)}
.muted{color:var(--muted)}
.small{font-size:13px}

header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.hwrap{max-width:1180px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));display:grid;gap:10px}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.brand .sub{font-size:13px;color:var(--muted)}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav a{padding:9px 14px;border-radius:10px 10px 0 0;text-decoration:none;color:var(--muted);font-weight:500;white-space:nowrap;border-bottom:2px solid transparent}
nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
main{max-width:1180px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right)) calc(80px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:grid;gap:22px}
.banner{padding:10px 14px;border-radius:10px;background:var(--warn-bg);color:var(--ink);font-size:14px}
.banner:empty{display:none}

.sec{display:grid;gap:12px}
.sechead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.tile{padding:12px 14px;display:grid;gap:2px;position:relative;overflow:hidden}
.tile .lab{font-size:13px;color:var(--muted)}
.tile .val{font-size:24px;font-weight:500}
.tile .val small{font-size:13px;color:var(--muted);font-family:var(--body);margin-left:3px}
.tile .meta{font-size:12px;color:var(--muted)}
.tile.s-ok{box-shadow:inset 3px 0 0 var(--ok)}
.tile.s-warn{box-shadow:inset 3px 0 0 var(--warn)}
.tile.s-bad{box-shadow:inset 3px 0 0 var(--bad)}
.tile.s-none{box-shadow:inset 3px 0 0 var(--line)}
.stock .val{font-family:var(--display);font-size:30px;font-weight:700}

.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.neutral{background:transparent;border-color:var(--line);color:var(--muted)}
.chip.acc{background:var(--band);color:var(--accent)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;font-size:14px;min-height:38px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;min-height:30px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 14px;cursor:pointer;font-size:14px;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.dot.blue{background:#4057ff;box-shadow:0 0 6px #4057ff}
.dot.white{background:#f4f1e8;border:1px solid #b9b3a2}

/* charts */
.charts{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.chart{padding:12px 14px 8px;display:grid;gap:4px}
.chart .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.chart .top .v{font-size:20px;font-weight:500}
.chart svg{width:100%;height:auto;display:block}
.chart svg text{fill:var(--muted);font:10px var(--mono)}
.nodata{padding:28px 0;text-align:center;color:var(--muted);font-size:13px}

/* table */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);white-space:nowrap;position:sticky;top:0;background:var(--surface)}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.c-ok{color:var(--ok)} td.c-warn{color:var(--warn);background:var(--warn-bg)} td.c-bad{color:var(--bad);background:var(--bad-bg)}
td.obs{min-width:240px;max-width:380px;color:var(--muted)}
tr:last-child td{border-bottom:0}

/* corals */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);min-width:0;flex:1 1 180px;max-width:280px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.filters button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--band)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.ccard{overflow:hidden;cursor:pointer;text-align:left;padding:0;display:grid;border:1px solid var(--line);background:var(--surface);border-radius:14px}
.ccard:hover{border-color:var(--accent)}
.ccard .info{padding:10px 12px 12px;display:grid;gap:4px}
.ccard .name{font-weight:600;line-height:1.3}
.ccard .stats{font-size:13px;color:var(--muted)}
.ph{aspect-ratio:1/1;width:100%;position:relative;overflow:hidden;background:var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .tag{position:absolute;left:8px;bottom:8px;background:rgba(5,10,20,.68);color:#fff;font-size:11px;padding:2px 8px;border-radius:999px}
.ph .tagr{left:auto;right:8px;top:8px;bottom:auto}
.ph.empty{display:grid;place-items:center;color:rgba(255,255,255,.92);font-family:var(--display);font-size:30px;font-weight:700}
.g-Zoanthus{background:linear-gradient(140deg,#1f3a8f,#6a2fb8 60%,#e0743a)}
.g-Palythoa{background:linear-gradient(140deg,#2c2a6e,#7a3d9c 60%,#c5578f)}
.g-Mushroom{background:linear-gradient(140deg,#13406b,#1c7a8c 55%,#d6a43c)}
.g-Ricordea{background:linear-gradient(140deg,#0f4a52,#2a9a6b 55%,#f0b13e)}
.g-Soft{background:linear-gradient(140deg,#3a3f52,#6c7a5a 60%,#c7b37a)}
.g-LPS{background:linear-gradient(140deg,#14305e,#2d7e6f 55%,#9fd65a)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(3,8,16,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:28px 16px;overflow-y:auto}
.modal{background:var(--bg);border:1px solid var(--line);border-radius:16px;width:100%;max-width:980px;display:grid}
.modal.narrow{max-width:620px}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:-28px;background:var(--bg);border-radius:16px 16px 0 0;z-index:2}
.mbody{padding:18px;display:grid;gap:20px}
.cols{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:760px){
  .cols{grid-template-columns:1fr}
  .overlay{padding:0}
  .modal{border-radius:0;min-height:100%}
  .mhead{top:0;border-radius:0;padding-top:calc(14px + env(safe-area-inset-top))}
}
.photo{display:grid;gap:10px}
.photo .ph{border-radius:14px}
.gallery{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.gallery button{flex:0 0 58px;padding:0;border:2px solid transparent;border-radius:8px;overflow:hidden;cursor:pointer;background:none;position:relative}
.gallery button[aria-pressed="true"]{border-color:var(--accent)}
.gallery img{width:54px;height:54px;object-fit:cover;display:block}
.gallery span{position:absolute;left:0;right:0;bottom:0;font-size:9px;background:rgba(5,10,20,.65);color:#fff;text-align:center}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.field{display:grid;gap:4px}
.field.wide{grid-column:1/-1}
.field label{font-size:12px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);width:100%;min-width:0}
.field textarea{min-height:70px;resize:vertical}
.field .hint{font-size:11px;color:var(--muted)}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.frags{display:grid;gap:8px}
.frag{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;padding:10px;align-items:start}
.frag .ph{border-radius:9px;width:64px}
.frag .ph.empty{font-size:16px}
.frag .fbody{display:grid;gap:8px}
.frag .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.frag input.lbl{font-weight:600;border:1px solid transparent;background:transparent;padding:3px 6px;border-radius:7px;width:min(100%,220px)}
.frag input.lbl:hover,.frag input.lbl:focus{border-color:var(--line);background:var(--surface)}
.frag select,.frag input.price{padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:13px}
.frag input.price{width:96px}
.frag.st-vendido,.frag.st-perdido{opacity:.6}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.stepper button{border:0;background:transparent;width:32px;height:32px;cursor:pointer;font-size:17px}
.stepper button:hover{background:var(--band)}
.stepper span{min-width:72px;text-align:center;font-size:14px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.toast.err{background:var(--bad);color:#fff}
.empty-state{padding:26px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.notes{display:grid;gap:8px}
.note{padding:10px 14px;display:grid;gap:2px}
.vit-head{padding:18px;display:grid;gap:6px}
.price{font-family:var(--mono);font-weight:500}
.ro .edit{display:none !important}
.login{max-width:420px;margin:40px auto;padding:22px;display:grid;gap:14px}
.brand .out{margin-left:auto}
.ph img.broken{display:none}
.ph:has(img.broken){display:grid;place-items:center}
.ph:has(img.broken)::after{content:"Foto indisponível · envie de novo";font-size:12px;color:var(--muted);padding:8px;text-align:center}
.crop-ov{z-index:70}
.cropbox{width:100%;max-width:520px;margin:0 auto;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:#000}
.cropbox canvas{display:block;touch-action:none;cursor:grab}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>

    <div class="brand">

<script>

const INACTIVE = new Set(["vendido","perdido"]);
const ZONES = {"":"—", centro:"Centro (luz alta)", meio:"Meio", periferia:"Periferia (luz baixa)"};

const $ = s => document.querySelector(s);

function today(){ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function fmtDate(iso, short){ if(!iso) return "—"; const [y,m,d]=iso.split("-"); return short? `${d}/${m}` : `${d}/${m}/${y.slice(2)}`; }
function dayN(iso){ return Math.round((Date.parse(iso)-Date.parse(START))/864e5); }
function fmt(v,d){ if(v==null||v==="") return "—"; return Number(v).toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d}); }
function fmtV(p,t){ const v=t[p.k]; if(v==null) return "—"; const q=(t.qual||{})[p.k]; return (q||"")+fmt(v,p.d); }
function parseNum(s){ s=String(s??"").trim(); if(!s) return {v:null}; let q=""; if(/^[<>]/.test(s)){ q=s[0]; s=s.slice(1).trim(); }
  if(/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s=s.replace(/\./g,""); s=s.replace(",","."); const v=Number(s); return isNaN(v)?{v:null,bad:true}:{v,q}; }
function minutes(t){ const m=String(t||"").match(/(\d{1,2})\s*[h:]\s*(\d{2})?/i); return m? (+m[1])*60+(+(m[2]||0)) : 0; }
const tkey = t => t.date + String(minutes(t.time)).padStart(4,"0");

const SLAB = {ok:"No alvo", warn:"Atenção", bad:"Fora", none:"Sem dado"};

function totals(c){ const fs=(c.frags||[]).filter(f=>!INACTIVE.has(f.status)); return {frags:fs.length, polyps:fs.reduce((a,f)=>a+(+f.polyps||0),0), avail:fs.filter(f=>f.status==="disponivel").length}; }

function coverFor(c, light){ const cv=c.cover||{}; const other = light==="blue"?"white":"blue"; if(cv[light]) return {id:cv[light],fallback:false}; if(cv[other]) return {id:cv[other],fallback:true}; return null; }

function chartSVG(p, pts){
  if(!pts.length) return `<div class="nodata">Sem medições</div>`;
  const W=320,H=132,L=40,R=12,T=10,B=22;
  const xs=pts.map(a=>a.x); let x0=Math.min(...xs), x1=Math.max(...xs); if(x1-x0<864e5){x0-=864e5*2;x1+=864e5*2;}
  const vs=pts.map(a=>a.v); const dmin=Math.min(...vs), dmax=Math.max(...vs);
  let y0=Math.min(dmin,p.ok[0]), y1=Math.max(dmax,p.ok[1]); let pad=(y1-y0)*0.18; if(!pad) pad=Math.abs(y1)*0.05||1; y0-=pad; y1+=pad;
  if(dmin>=0 && p.ok[0]>=0 && y0<0) y0 = -(y1)*0.04;
  const sx=x=>L+(x-x0)/(x1-x0)*(W-L-R), sy=v=>T+(1-(v-y0)/(y1-y0))*(H-T-B);
  const bt=sy(p.ok[1]), bb=sy(p.ok[0]);
  let g=`<rect x="${L}" y="${bt.toFixed(1)}" width="${W-L-R}" height="${Math.max(1.5,bb-bt).toFixed(1)}" fill="var(--band)"/>`;
  g+=`<line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="var(--line)"/>`;
  const lab=(v,y)=>`<text x="${L-6}" y="${(y+3).toFixed(1)}" text-anchor="end">${esc(fmt(v,p.d))}</text><line x1="${L}" x2="${W-R}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--accent)" stroke-opacity=".35" stroke-dasharray="3 3"/>`;
  if(bb-bt>=12){ g+=lab(p.ok[1],bt)+lab(p.ok[0],bb); } else { g+=lab(p.ok[1],bt); }
  const path=pts.map((a,i)=>(i?"L":"M")+sx(a.x).toFixed(1)+" "+sy(a.v).toFixed(1)).join(" ");
  g+=`<path d="${path}" fill="none" stroke="var(--ink)" stroke-opacity=".75" stroke-width="1.6"/>`;
  pts.forEach((a,i)=>{ const st=status(p,a.v,a.q); const last=i===pts.length-1; const col=st==="ok"?"var(--ok)":st==="warn"?"var(--warn)":"var(--bad)";
    g+=`<circle cx="${sx(a.x).toFixed(1)}" cy="${sy(a.v).toFixed(1)}" r="${last?4.5:2.8}" fill="${last?col:"var(--surface)"}" stroke="${col}" stroke-width="1.6"><title>${fmtDate(a.date)}: ${esc((a.q||"")+fmt(a.v,p.d))}</title></circle>`; });
  const d0=new Date(pts[0].x), d1=new Date(pts[pts.length-1].x); const ds=d=>String(d.getUTCDate()).padStart(2,"0")+"/"+String(d.getUTCMonth()+1).padStart(2,"0");
  g+=`<text x="${sx(pts[0].x).toFixed(1)}" y="${H-6}" text-anchor="${pts.length>1?"start":"middle"}">${ds(d0)}</text>`;
  if(pts.length>1) g+=`<text x="${sx(pts[pts.length-1].x).toFixed(1)}" y="${H-6}" text-anchor="end">${ds(d1)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(p.l)} ao longo do tempo">${g}</svg>`;
}

function growthSVG(h){
  if(!h||h.length<2) return `<div class="nodata">O gráfico de crescimento aparece a partir da segunda contagem de pólipos.</div>`;
  const W=520,H=150,L=34,R=14,T=12,B=24; const xs=h.map(a=>Date.parse(a.d)); const x0=Math.min(...xs), x1=Math.max(...xs)||x0+1;
  const ys=h.map(a=>a.polyps); const y1=Math.max(...ys)*1.15+1, y0=0;
  const sx=x=>L+(x-x0)/((x1-x0)||1)*(W-L-R), sy=v=>T+(1-(v-y0)/(y1-y0))*(H-T-B);
  let g=`<line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="var(--line)"/>`;
  const mx=Math.max(...ys); g+=`<line x1="${L}" x2="${W-R}" y1="${sy(mx).toFixed(1)}" y2="${sy(mx).toFixed(1)}" stroke="var(--line)" stroke-dasharray="3 3"/><text x="${L-6}" y="${(sy(mx)+3).toFixed(1)}" text-anchor="end">${mx}</text><text x="${L-6}" y="${H-B+3}" text-anchor="end">0</text>`;
  const pth=h.map((a,i)=>(i?"L":"M")+sx(xs[i]).toFixed(1)+" "+sy(a.polyps).toFixed(1)).join(" ");
  g+=`<path d="${pth} L${sx(xs[xs.length-1]).toFixed(1)} ${H-B} L${sx(xs[0]).toFixed(1)} ${H-B} Z" fill="var(--band)"/><path d="${pth}" fill="none" stroke="var(--accent)" stroke-width="2"/>`;
  h.forEach((a,i)=>{ const last=i===h.length-1; g+=`<circle cx="${sx(xs[i]).toFixed(1)}" cy="${sy(a.polyps).toFixed(1)}" r="${last?4.5:2.6}" fill="${last?"var(--accent)":"var(--surface)"}" stroke="var(--accent)" stroke-width="1.6"><title>${fmtDate(a.d)}: ${a.polyps} pólipos, ${a.frags} mudas</title></circle>`; });
  g+=`<text x="${L}" y="${H-6}">${fmtDate(h[0].d,true)}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${fmtDate(h[h.length-1].d,true)}</text>`;

async function loadImage(file){
  const url=URL.createObjectURL(file); const img=new Image();
  try{ await new Promise((r,j)=>{ img.onload=r; img.onerror=()=>j(new Error("img")); img.src=url; }); }
  finally{ setTimeout(()=>URL.revokeObjectURL(url),1000); }
  const w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,2400/Math.max(w,h));
  const cv=document.createElement("canvas"); cv.width=Math.round(w*k); cv.height=Math.round(h*k);
  const c=cv.getContext("2d"); c.imageSmoothingQuality="high"; c.drawImage(img,0,0,cv.width,cv.height); return cv;
}
function scaled(src,n){ const o=document.createElement("canvas"); o.width=o.height=n; const c=o.getContext("2d"); c.imageSmoothingQuality="high"; c.drawImage(src,0,0,n,n); return o; }
function compactDataURL(cv){
  for(const [n,q] of [[800,0.8],[800,0.68],[640,0.68],[520,0.6]]){ const d=scaled(cv,Math.min(n,cv.width)).toDataURL("image/jpeg",q); if(d.length<230000) return d; }
  return null;
}
function openCropper(src){ return new Promise(resolve=>{

    <div class="mhead"><h2>Recortar foto</h2><button class="btn" id="cr-cancel" type="button">Cancelar</button></div>
    <div class="mbody">
      <div class="cropbox"><canvas id="cr-cv" aria-label="Área de recorte quadrada"></canvas></div>
      <div class="toolbar"><label for="cr-zoom" class="small muted">Zoom</label><input id="cr-zoom" type="range" min="1" max="5" step="0.01" value="1" style="flex:1;min-width:120px">
        <button class="btn sm" id="cr-rot" type="button">Girar 90°</button></div>
      <span class="small muted">Arraste a foto para posicionar. Dê zoom com dois dedos ou com o controle.</span>
      <div class="toolbar" style="justify-content:flex-end"><button class="btn primary" id="cr-ok" type="button">Usar esta foto</button></div>
    </div></div></div>`;
  const cv=$("#cr-cv"), ctx=cv.getContext("2d"), box=cv.parentElement, zin=$("#cr-zoom");
  const dpr=Math.min(2,window.devicePixelRatio||1); let V=0, base=1, z=1, ox=0, oy=0;
  const sz=()=>{ V=box.clientWidth||320; cv.width=cv.height=Math.round(V*dpr); cv.style.width=cv.style.height=V+"px"; base=Math.max(V/img.width,V/img.height); };
  const clamp=()=>{ const s=base*z; ox=Math.min(0,Math.max(V-img.width*s,ox)); oy=Math.min(0,Math.max(V-img.height*s,oy)); };
  const center=()=>{ const s=base*z; ox=(V-img.width*s)/2; oy=(V-img.height*s)/2; };
  const draw=()=>{ clamp(); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.fillStyle="#000"; ctx.fillRect(0,0,V,V); ctx.imageSmoothingQuality="high";
    const s=base*z; ctx.drawImage(img,ox,oy,img.width*s,img.height*s);
    ctx.strokeStyle="rgba(255,255,255,.35)"; ctx.lineWidth=1; ctx.beginPath();
    for(let i=1;i<3;i++){ ctx.moveTo(V*i/3,0); ctx.lineTo(V*i/3,V); ctx.moveTo(0,V*i/3); ctx.lineTo(V,V*i/3); } ctx.stroke(); };
  const zoomAt=(nz,px,py)=>{ nz=Math.min(5,Math.max(1,nz)); const s0=base*z, s1=base*nz; ox=px-(px-ox)*s1/s0; oy=py-(py-oy)*s1/s0; z=nz; zin.value=z; draw(); };
  sz(); center(); draw();
  const pts=new Map(); let pinch=null;

  cv.addEventListener("pointerdown",e=>{ try{cv.setPointerCapture(e.pointerId);}catch(_){} pts.set(e.pointerId,pos(e)); pinch=null; });
  cv.addEventListener("pointermove",e=>{ if(!pts.has(e.pointerId)) return; const prev=pts.get(e.pointerId), cur=pos(e); pts.set(e.pointerId,cur);
    if(pts.size===1){ ox+=cur.x-prev.x; oy+=cur.y-prev.y; draw(); return; }
    const [a,b]=[...pts.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y)||1, mx=(a.x+b.x)/2, my=(a.y+b.y)/2;

  const up=e=>{ pts.delete(e.pointerId); pinch=null; }; cv.addEventListener("pointerup",up); cv.addEventListener("pointercancel",up);
  cv.addEventListener("wheel",e=>{ e.preventDefault(); const p=pos(e); zoomAt(z*Math.exp(-e.deltaY*0.0015),p.x,p.y); },{passive:false});
  zin.addEventListener("input",()=>zoomAt(+zin.value,V/2,V/2));
  $("#cr-rot").addEventListener("click",()=>{ const r=document.createElement("canvas"); r.width=img.height; r.height=img.width; const c=r.getContext("2d"); c.translate(r.width,0); c.rotate(Math.PI/2); c.drawImage(img,0,0); img=r; base=Math.max(V/img.width,V/img.height); z=1; zin.value=1; center(); draw(); });
  const onResize=()=>{ const s=base*z, fx=(V/2-ox)/s, fy=(V/2-oy)/s; sz(); const s2=base*z; ox=V/2-fx*s2; oy=V/2-fy*s2; draw(); };
  window.addEventListener("resize",onResize);
  const finish=v=>{ window.removeEventListener("resize",onResize); host.innerHTML=""; resolve(v); };
  $("#cr-cancel").addEventListener("click",()=>finish(null));
  $("#cr-ok").addEventListener("click",()=>{ const s=base*z; const OUT=Math.max(600,Math.min(1200,Math.round(V/s))); const k=OUT/V;
    const o=document.createElement("canvas"); o.width=o.height=OUT; const c=o.getContext("2d"); c.imageSmoothingQuality="high";
    c.drawImage(img,ox*k,oy*k,img.width*s*k,img.height*s*k); finish(o); });

function makeDB(sb){
  const L={tests:[],corals:[]}, C={tests:new Map(),corals:new Map()};
  const emit=col=>{ const docs=[...C[col].entries()].map(([id,d])=>({id,exists:true,data:()=>d})); L[col].forEach(f=>f({docs,metadata:{fromCache:false}})); };
  async function load(col){ const {data,error}=await sb.from(col).select("id,data"); if(error) throw error; C[col]=new Map(data.map(r=>[r.id,r.data])); emit(col); }
  return {
    load, reload(){ return Promise.all(["tests","corals"].map(c=>load(c).catch(()=>{}))); },
    reset(){ C.tests=new Map(); C.corals=new Map(); emit("tests"); emit("corals"); },
    collection(col){ return { onSnapshot(next,err){ L[col].push(next); load(col).catch(e=>err&&err(e)); return ()=>{}; } }; },
    doc(path){ const [col,id]=path.split("/"); return {
      async set(data){ const {error}=await sb.from(col).upsert({id,data,updated_at:new Date().toISOString()}); if(error) throw error; C[col].set(id,clone(data)); emit(col); },
      async delete(){ const {error}=await sb.from(col).delete().eq("id",id); if(error) throw error; C[col].delete(id); emit(col); } }; }
  };
}
(async ()=>{
  if(!window.supabase){ setBanner("Não foi possível carregar o app. Verifique a conexão e recarregue."); return; }
  const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  S.sb=sb; S.db=makeDB(sb);

    if(subscribed){ S.db.reload(); return; } subscribed=true;
    const timer=setTimeout(()=>setBanner("Os dados ainda não chegaram. Verifique a conexão."),10000);
    let gt=false,gc=false; const done=()=>{ if(gt&&gc){ clearTimeout(timer); setBanner(""); } };
    S.db.collection("tests").onSnapshot(s=>{ S.tests=s.docs.map(d=>Object.assign({id:d.id},d.data())); gt=true; done(); render(); }, e=>{ clearTimeout(timer); setBanner(errMsg(e)); });
    S.db.collection("corals").onSnapshot(s=>{
      S.corals=s.docs.map(d=>Object.assign({id:d.id},d.data())); gc=true; done();
      if(gc&&S.session&&!S.corals.length&&!S.tests.length) setBanner("Nenhum dado visível para esta conta. Entre com o e-mail dono do mudário.");
      render();
      if(S.modalKind==="coral" && S.draft && !pending[S.draft.id]){
        const fresh=S.corals.find(c=>c.id===S.draft.id);
        if(!fresh){ S.modalKind=null; S.draft=null; renderModal(); }
        else { const a=clone(fresh), b=clone(S.draft); delete a.updatedAt; delete b.updatedAt; if(JSON.stringify(a)!==JSON.stringify(b) && !document.activeElement.matches("input,textarea")){ S.draft=clone(fresh); renderModal(); } }
      }
    }, e=>{ clearTimeout(timer); setBanner(errMsg(e)); });
  };
  const {data:{session}}=await sb.auth.getSession();
  S.session=session; S.authReady=true; setBanner("");
  if(session) start(); render();
  sb.auth.onAuthStateChange((ev,sess)=>{ const had=!!S.session; S.session=sess;
    if(sess && !had){ setBanner(""); start(); }
    if(!sess && had){ S.tests=[]; S.corals=[]; S.modalKind=null; S.draft=null; renderModal(); }
    render(); });
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && S.session && !S.modalKind) S.db.reload(); });
})();
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
